<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <circle cx="24" cy="24" r="24" fill="#c0000a"/>
  <!-- Play mark. Corners are rounded by stroking the triangle's own outline,
       so the geometry stays a plain 3-point path. Sits right of true center
       because a centroid-centered play mark reads as left-leaning. -->
  <path d="M20 17.5 L32 24 L20 30.5 Z" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
</svg>
